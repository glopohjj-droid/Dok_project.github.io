<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Новости • Админ-панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f7fa;
      color: #1e293b;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12);
      padding: 30px 25px;
      margin-bottom: 30px;
      transition: all 0.25s ease;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    h1, h2, h3 {
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .site-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .site-title i {
      color: #3b82f6;
      font-size: 2rem;
      transition: transform 0.3s ease;
    }

    .site-title:hover i {
      transform: rotate(-6deg) scale(1.02);
    }

    .subhead {
      color: #64748b;
      font-weight: 400;
      border-left: 4px solid #3b82f6;
      padding-left: 16px;
      margin-bottom: 24px;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      align-items: center;
      animation: fadeIn 0.6s ease-out 0.1s both;
    }

    .admin-badge {
      background: #eef2ff;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e4f8a;
      cursor: default;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .admin-badge i {
      font-size: 0.9rem;
    }

    /* --- Админ-панель --- */
    .admin-panel {
      display: none;
      background: #f8fafc;
      border-radius: 28px;
      padding: 24px 20px;
      margin-top: 18px;
      border: 1px solid #e2e8f0;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
      animation: expandIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    @keyframes expandIn {
      0% { opacity: 0; transform: scale(0.96) translateY(-8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .admin-panel.visible {
      display: block;
    }

    .admin-panel h2 {
      font-size: 1.4rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0f172a;
    }

    .admin-panel h2 i {
      color: #3b82f6;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      background: white;
      transition: 0.25s ease;
      outline: none;
      color: #0f172a;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 5px rgba(59,130,246,0.12);
      transform: scale(1.005);
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .file-upload-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .file-upload-wrapper input[type="file"] {
      flex: 1;
      padding: 12px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 30px;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .file-upload-wrapper input[type="file"]:hover {
      border-color: #3b82f6;
      background: #fafcff;
    }

    .file-upload-wrapper input[type="file"]::file-selector-button {
      background: #eef2ff;
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      color: #1e4f8a;
      margin-right: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .file-upload-wrapper input[type="file"]::file-selector-button:hover {
      background: #d9e2ff;
      transform: scale(1.02);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #3b82f6;
      border: none;
      color: white;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 4px 12px -4px rgba(59,130,246,0.3);
      border: 1px solid transparent;
    }

    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 10px 20px -8px rgba(59,130,246,0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
      transform: translateY(-2px);
    }

    .btn-danger {
      background: #ef4444;
      box-shadow: 0 4px 12px -4px rgba(239,68,68,0.3);
    }

    .btn-danger:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    /* --- Ключ-строка --- */
    .key-input-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      background: #f1f5f9;
      padding: 12px 18px;
      border-radius: 60px;
      margin-bottom: 16px;
      transition: 0.3s ease;
      animation: fadeIn 0.5s ease-out 0.2s both;
    }

    .key-input-row input {
      flex: 1;
      min-width: 160px;
      padding: 12px 18px;
      border: none;
      border-radius: 40px;
      background: white;
      font-family: 'Montserrat', sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: 0.2s;
    }

    .key-input-row input:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      box-shadow: 0 4px 12px rgba(59,130,246,0.08);
    }

    /* --- Список новостей --- */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 30px;
      margin-top: 10px;
    }

    .news-item {
      background: white;
      border-radius: 28px;
      padding: 20px 22px 22px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
      border: 1px solid #edf2f7;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      animation: cardPop 0.45s ease-out both;
      transform-origin: top center;
    }

    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.94) translateY(16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .news-item:hover {
      border-color: #cbd5e1;
      box-shadow: 0 14px 32px -10px rgba(0,0,0,0.08);
      transform: translateY(-4px);
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .news-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
    }

    .news-meta {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .news-body {
      font-size: 1rem;
      line-height: 1.6;
      color: #1e293b;
      margin: 12px 0 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .news-image {
      max-width: 100%;
      border-radius: 20px;
      margin: 14px 0 6px;
      border: 1px solid #eef2f6;
      max-height: 400px;
      object-fit: cover;
      width: auto;
      display: block;
      background: #f1f5f9;
      animation: imageReveal 0.5s ease-out;
    }

    @keyframes imageReveal {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    .news-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
    }

    .btn-sm {
      padding: 8px 18px;
      font-size: 0.8rem;
      border-radius: 40px;
      background: #f1f5f9;
      color: #334155;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sm:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-sm.danger {
      color: #b91c1c;
      background: #fee2e2;
    }
    .btn-sm.danger:hover {
      background: #fecaca;
      transform: translateY(-2px);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      animation: fadeIn 0.6s ease-out;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 16px;
      color: #cbd5e1;
      transition: transform 0.3s ease;
    }

    .empty-state i:hover {
      transform: rotate(6deg) scale(1.05);
    }

    /* Адаптив */
    @media (max-width: 640px) {
      .container { padding: 20px 16px; }
      .site-title { font-size: 1.5rem; }
      .news-title { font-size: 1.25rem; }
      .admin-panel { padding: 18px 14px; }
    }

    /* Анимация удаления */
    .news-item.removing {
      animation: cardRemove 0.3s ease-in forwards;
    }

    @keyframes cardRemove {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.92) translateY(-12px); }
    }

    /* Анимация добавления */
    .news-item.adding {
      animation: cardAdd 0.4s ease-out both;
    }

    @keyframes cardAdd {
      0% { opacity: 0; transform: scale(0.92) translateY(30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="site-title">
    <i class="fas fa-newspaper"></i> 
    <span>Новостной портал</span>
  </div>
  <div class="subhead">
    <span><i class="far fa-clock" style="margin-right: 6px;"></i> Свежие новости</span>
    <span class="admin-badge" id="adminStatusBadge">
      <i class="fas fa-lock"></i> Админ-режим: выкл
    </span>
  </div>

  <!-- Блок ввода ключа -->
  <div class="key-input-row">
    <i class="fas fa-key" style="color: #64748b;"></i>
    <input type="password" id="adminKeyInput" placeholder="Введите ключ доступа" autocomplete="off">
    <button class="btn" id="unlockAdminBtn"><i class="fas fa-unlock-alt"></i> Войти</button>
    <button class="btn btn-secondary" id="lockAdminBtn" style="display: none;"><i class="fas fa-lock"></i> Выйти</button>
  </div>

  <!-- Админ-панель (добавление новостей) -->
  <div class="admin-panel" id="adminPanel">
    <h2><i class="fas fa-pen-fancy"></i> Создать новость</h2>
    <form id="newsForm">
      <div class="form-group">
        <label for="newsTitle">Заголовок</label>
        <input type="text" id="newsTitle" placeholder="Например: Открытие нового парка" required>
      </div>
      <div class="form-group">
        <label for="newsText">Текст новости</label>
        <textarea id="newsText" placeholder="Подробности события..." required></textarea>
      </div>
      <div class="form-group">
        <label for="newsImage"><i class="far fa-image"></i> Фото (jpg, png, webp)</label>
        <div class="file-upload-wrapper">
          <input type="file" id="newsImage" accept="image/*">
        </div>
        <small style="color: #94a3b8; display: block; margin-top: 6px;">Файл сохраняется в локальное хранилище как Data URL</small>
      </div>
      <div class="admin-actions">
        <button type="submit" class="btn"><i class="fas fa-cloud-upload-alt"></i> Опубликовать</button>
        <button type="button" class="btn btn-secondary" id="clearAllNewsBtn"><i class="fas fa-trash-alt"></i> Удалить все</button>
      </div>
    </form>
    <p style="margin-top: 16px; font-size: 0.9rem; color: #475569;"><i class="fas fa-info-circle"></i> Новости сохраняются в браузере (localStorage). При переносе файла данные остаются.</p>
  </div>
</div>

<!-- Список новостей -->
<div class="container" style="padding-bottom: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
    <h2 style="font-size: 1.4rem; display: flex; gap: 8px;"><i class="fas fa-list-ul" style="color: #3b82f6;"></i> Лента</h2>
    <span id="newsCount" style="background: #eef2ff; padding: 4px 14px; border-radius: 40px; font-size: 0.8rem; font-weight: 600;">0</span>
  </div>
  <div id="newsContainer" class="news-list">
    <div class="empty-state">
      <i class="far fa-newspaper"></i>
      <p>Пока нет новостей. Станьте первым!</p>
    </div>
  </div>
</div>

<script>
  (function() {
    // --- Константы ---
    const STORAGE_KEY = 'newsApp_articles';
    const ADMIN_KEY = 'admin123';

    // --- DOM ---
    const adminPanel = document.getElementById('adminPanel');
    const adminStatusBadge = document.getElementById('adminStatusBadge');
    const keyInput = document.getElementById('adminKeyInput');
    const unlockBtn = document.getElementById('unlockAdminBtn');
    const lockBtn = document.getElementById('lockAdminBtn');
    const newsForm = document.getElementById('newsForm');
    const titleInput = document.getElementById('newsTitle');
    const textInput = document.getElementById('newsText');
    const imageInput = document.getElementById('newsImage');
    const newsContainer = document.getElementById('newsContainer');
    const newsCountSpan = document.getElementById('newsCount');
    const clearAllBtn = document.getElementById('clearAllNewsBtn');

    let isAdmin = false;

    // --- Загрузка / сохранение ---
    function loadNews() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch { return []; }
    }

    function saveNews(arr) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    }

    // --- Рендер с анимациями ---
    function renderNews() {
      const articles = loadNews();
      if (!articles || articles.length === 0) {
        newsContainer.innerHTML = `
          <div class="empty-state">
            <i class="far fa-newspaper"></i>
            <p>Пока нет новостей. Добавьте первую!</p>
          </div>
        `;
        newsCountSpan.textContent = '0';
        return;
      }

      const sorted = [...articles].reverse();
      let html = '';
      sorted.forEach((item, index) => {
        const realIndex = articles.length - 1 - index;
        const imageTag = item.imageData ? 
          `<img src="${item.imageData}" alt="Фото новости" class="news-image" loading="lazy">` : '';
        
        html += `
          <div class="news-item" data-index="${realIndex}" style="animation-delay: ${index * 0.05}s">
            <div class="news-header">
              <div class="news-title">${escapeHtml(item.title) || 'Без заголовка'}</div>
              <div class="news-meta">
                <i class="far fa-calendar-alt"></i> ${item.date || 'неизвестно'}
              </div>
            </div>
            <div class="news-body">${escapeHtml(item.text) || ''}</div>
            ${imageTag}
            <div class="news-footer">
              ${isAdmin ? `<button class="btn-sm danger" data-action="delete" data-idx="${realIndex}"><i class="fas fa-trash-alt"></i> Удалить</button>` : ''}
            </div>
          </div>
        `;
      });

      newsContainer.innerHTML = html;
      newsCountSpan.textContent = articles.length;

      if (isAdmin) {
        document.querySelectorAll('[data-action="delete"]').forEach(btn => {
          btn.addEventListener('click', function(e) {
            const idx = parseInt(this.dataset.idx, 10);
            if (!isNaN(idx)) deleteNewsItem(idx);
          });
        });
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // --- Добавление с анимацией ---
    function addNews(title, text, imageData) {
      const articles = loadNews();
      const now = new Date();
      const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', year: 'numeric' });
      const newItem = {
        title: title.trim(),
        text: text.trim(),
        imageData: imageData || null,
        date: dateStr,
        timestamp: now.getTime()
      };
      articles.push(newItem);
      saveNews(articles);
      renderNews();
      // подсветка последней добавленной
      const items = document.querySelectorAll('.news-item');
      if (items.length > 0) {
        const last = items[items.length - 1];
        last.classList.add('adding');
        setTimeout(() => last.classList.remove('adding'), 500);
      }
    }

    // --- Удаление с анимацией ---
    function deleteNewsItem(index) {
      let articles = loadNews();
      if (index < 0 || index >= articles.length) return;
      
      // визуальное удаление
      const items = document.querySelectorAll('.news-item');
      let targetEl = null;
      for (let el of items) {
        if (parseInt(el.dataset.index, 10) === index) {
          targetEl = el;
          break;
        }
      }
      if (targetEl) {
        targetEl.classList.add('removing');
        setTimeout(() => {
          articles.splice(index, 1);
          saveNews(articles);
          renderNews();
        }, 300);
      } else {
        articles.splice(index, 1);
        saveNews(articles);
        renderNews();
      }
    }

    function clearAllNews() {
      if (confirm('Удалить все новости без возможности восстановления?')) {
        saveNews([]);
        renderNews();
      }
    }

    // --- Админ-интерфейс ---
    function updateAdminUI(adminMode) {
      isAdmin = adminMode;
      if (adminMode) {
        adminPanel.classList.add('visible');
        adminStatusBadge.innerHTML = `<i class="fas fa-unlock"></i> Админ-режим: вкл`;
        adminStatusBadge.style.background = '#dbeafe';
        adminStatusBadge.style.color = '#1e4f8a';
        unlockBtn.style.display = 'none';
        lockBtn.style.display = 'inline-flex';
        keyInput.value = '';
        keyInput.disabled = true;
      } else {
        adminPanel.classList.remove('visible');
        adminStatusBadge.innerHTML = `<i class="fas fa-lock"></i> Админ-режим: выкл`;
        adminStatusBadge.style.background = '#eef2ff';
        adminStatusBadge.style.color = '#1e4f8a';
        unlockBtn.style.display = 'inline-flex';
        lockBtn.style.display = 'none';
        keyInput.disabled = false;
        keyInput.value = '';
      }
      renderNews();
    }

    function handleAdminLogin() {
      const entered = keyInput.value.trim();
      if (entered === ADMIN_KEY) {
        updateAdminUI(true);
      } else {
        alert('Неверный ключ доступа.');
        keyInput.value = '';
        keyInput.focus();
      }
    }

    function handleAdminLogout() {
      updateAdminUI(false);
    }

    // --- Обработка формы ---
    function handleNewsSubmit(e) {
      e.preventDefault();
      if (!isAdmin) {
        alert('Только администратор может публиковать новости.');
        return;
      }

      const title = titleInput.value.trim();
      const text = textInput.value.trim();
      if (!title || !text) {
        alert('Заполните заголовок и текст новости.');
        return;
      }

      const file = imageInput.files[0];
      if (file && !file.type.startsWith('image/')) {
        alert('Пожалуйста, выберите изображение (jpg, png, webp и т.д.)');
        return;
      }

      if (file) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          addNews(title, text, ev.target.result);
          resetForm();
        };
        reader.onerror = () => alert('Не удалось прочитать файл.');
        reader.readAsDataURL(file);
      } else {
        addNews(title, text, null);
        resetForm();
      }
    }

    function resetForm() {
      titleInput.value = '';
      textInput.value = '';
      imageInput.value = '';
    }

    // --- Инициализация ---
    function init() {
      renderNews();
      updateAdminUI(false);

      unlockBtn.addEventListener('click', handleAdminLogin);
      lockBtn.addEventListener('click', handleAdminLogout);
      keyInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleAdminLogin();
      });

      newsForm.addEventListener('submit', handleNewsSubmit);
      clearAllBtn.addEventListener('click', clearAllNews);
    }

    init();
  })();
</script>
